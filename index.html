function dashboard(){head('Dashboard','Your field engineering workspace');let due=db.visits.filter(v=>v.actions?.trim()).length;let recent=db.visits.slice(-3).reverse();$('main').innerHTML=`<div class="grid2"><div class="metric"><span>Customer sites</span><strong>${db.sites.length}</strong><span>Ready to visit</span></div><div class="metric"><span>Reports recorded</span><strong>${db.visits.length}</strong><span>On this device</span></div><div class="metric"><span>Reports with actions</span><strong>${due}</strong><span>Follow up as needed</span></div><div class="metric"><span>Report templates</span><strong>${TYPES.length}</strong><span>Editable per site</span></div></div>${card('Quick actions',`<div class="grid2">${btn('＋ New site',"go('siteEdit',null)")}${btn('🧪 Record visit',"go('sites')",'ghost')}${btn('⚗ Dosing calculator',"go('calculator')",'ghost')}${btn('📄 View reports',"go('visits')",'ghost')}</div>`)}${card('Recent visits',recent.length?recent.map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${fmt(v.date)} · ${esc(v.type)}</div></div>${btn('View',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join(''):'<div class="empty">No visits recorded yet. Start with a customer site.</div>')}<div class="notice">Prototype only. Example test limits are illustrative, not approved operating or ACOP L8/HSG274 compliance criteria. Configure and verify limits for each actual system before professional use.</div>`}
function sites(){head('Customer sites','Saved locally on your iPhone');$('main').innerHTML=`${btn('＋ Add customer site',"go('siteEdit',null)")}${card('All sites',db.sites.map(s=>`<div class="rowline inline"><div><strong>${esc(s.name)}</strong><div style="margin-top:5px"><span class="chip">${esc(s.type)}</span></div></div>${btn('Open',`go('siteDetail','${s.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">Add your first site.</div>')}`}
function siteDetail(){const s=site();if(!s)return go('sites');head(s.name,s.type);const vs=db.visits.filter(v=>v.siteId===s.id).reverse();$('main').innerHTML=`${card('Site information',`<span class="chip">${esc(s.type)}</span><p class="note">${esc(s.notes||'No site notes added.')}</p><div class="grid2">${btn('🧪 Start visit',`startVisit('${s.id}')`)}${btn('⚙ Edit site',"go('siteEdit')",'ghost')}</div>`)}${card('Recent reports',vs.map(v=>`<div class="rowline inline"><div><strong>${fmt(v.date)}</strong><div class="muted">${v.readings.length} parameters · ${v.photos.length} photos</div></div>${btn('Report',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits saved for this site.</div>')}`}
function siteEdit(){const s=site();head(s?'Edit customer site':'New customer site','Customise parameters, units and limits');$('main').innerHTML=`${card('Site details',field('sitename','Customer / site name',s?.name||'')+`<div class="field"><label>System type</label><select id="sitetype" onchange="typeChanged()">${TYPES.map(t=>`<option ${s?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Site notes</label><textarea id="sitenotes">${esc(s?.notes||'')}</textarea></div>`)}${card('Custom test parameters',`<div id="parameter-fields"></div>${btn('＋ Add parameter','addParameter()','small ghost')}<p class="note">Each site has its own parameter list and editable minimum/maximum values. Blank limit = not assessed.</p>`)}<div class="grid2">${btn('Save site','saveSite()')}${btn('Cancel',"go('sites')",'ghost')}</div>`;drawParams(s?.params||paramsFor(TYPES[0]))}
function drawParams(params){$('parameter-fields').innerHTML=params.map((p,i)=>`<div class="rowline param" data-i="${i}"><div class="grid2">${field('pn'+i,'Parameter name',p.name)}${field('pu'+i,'Unit',p.unit)}</div><div class="grid2">${field('pmin'+i,'Minimum',p.min??'','number','step="any"')}${field('pmax'+i,'Maximum',p.max??'','number','step="any"')}</div>${btn('Remove',`removeParam(${i})`,'small danger')}</div>`).join('')};function readParams(){return [...document.querySelectorAll('.param')].map(e=>{let i=e.dataset.i;return {name:$('pn'+i).value.trim(),unit:$('pu'+i).value.trim(),min:$('pmin'+i).value===''?null:Number($('pmin'+i).value),max:$('pmax'+i).value===''?null:Number($('pmax'+i).value)}}).filter(p=>p.name)}function addParameter(){drawParams([...readParams(),{name:'',unit:'',min:null,max:null}])}function removeParam(i){drawParams(readParams().filter((_,j)=>j!==i))}function typeChanged(){if(confirm('Replace the current parameters with example parameters for this system type?'))drawParams(paramsFor($('sitetype').value))}function saveSite(){let name=$('sitename').value.trim();if(!name)return alert('Enter a site name');let obj={id:site()?.id||sid(),name,type:$('sitetype').value,notes:$('sitenotes').value.trim(),params:readParams()};let i=db.sites.findIndex(x=>x.id===obj.id);if(i>=0)db.sites[i]=obj;else db.sites.push(obj);persist();go('siteDetail',obj.id)}
function startVisit(id){let s=db.sites.find(x=>x.id===id);if(!s)return;const v={id:sid(),siteId:s.id,siteName:s.name,type:s.type,date:date(),readings:s.params.map(p=>({...p,value:''})),notes:'',actions:'',photos:[]};db.visits.push(v);persist();go('test',id,v.id)}
function visits(){head('Visit history','Your saved test results and reports');$('main').innerHTML=`${btn('＋ Start new site visit',"go('sites')")}${card('Saved visits',db.visits.slice().reverse().map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${fmt(v.date)} · ${esc(v.type)}</div></div>${btn('Open',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits yet.</div>')}`}
function test(){const v=visit();if(!v)return go('visits');head('Record test results',v.siteName);$('main').innerHTML=`${card('Visit details',field('testdate','Visit date',v.date,'date')+`<div class="muted">${esc(v.type)} · ${v.readings.length} configurable parameters</div>`)}${card('Water test results',v.readings.map((r,i)=>`<div class="testrow"><label for="reading${i}">${esc(r.name)}</label><input id="reading${i}" type="number" step="any" value="${esc(r.value)}" placeholder="—"><span>${esc(r.unit)}</span></div>`).join('')||'<p>No parameters set for this site.</p>')}${card('Engineer observations',`<div class="field"><label for="notes">Visit notes</label><textarea id="notes" placeholder="System observations, recommendations...">${esc(v.notes)}</textarea></div><div class="field"><label for="actions">Required corrective actions</label><textarea id="actions" placeholder="Record follow-up actions...">${esc(v.actions)}</textarea></div>`)}${card('Site photographs',`<p class="note">Take a photo or select from your library. Photos are stored on this device and added to this visit's report.</p><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event)"><div class="photos" id="photoList">${v.photos.map((p,i)=>`<img class="photo" alt="Site photo ${i+1}" src="${p}">`).join('')}</div>`)}<div class="grid2">${btn('Save visit',"saveTest()")}${btn('Preview report',"saveTest(true)",'ghost')}</div>`}
function saveTest(preview=false){const v=visit();if(!v)return;v.date=$('testdate').value;v.readings.forEach((r,i)=>r.value=$('reading'+i).value);v.notes=$('notes').value;v.actions=$('actions').value;persist();if(preview)go('report');else go('visitDetail',null,v.id)}
async function addPhoto(event){const f=event.target.files[0];if(!f)return;const v=visit();if(!v)return;const img=new Image();const blob=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas');const scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);v.photos.push(c.toDataURL('image/jpeg',.62));URL.revokeObjectURL(blob);persist();$('photoList').innerHTML=v.photos.map((p,i)=>`<img class="photo" src="${p}" alt="Site photo ${i+1}">`).join('');event.target.value=''};img.onerror=()=>alert('Could not read this image');img.src=blob}
function visitDetail(){let v=visit();if(!v)return go('visits');head('Saved site visit',v.siteName);const count=v.readings.filter(x=>x.value!=='').length,issues=v.readings.filter(x=>outOfRange(x)).length;$('main').innerHTML=`${card('Visit summary',`<div class="inline"><div><strong>${fmt(v.date)}</strong><div class="muted">${esc(v.type)}</div></div><span class="chip ${issues?'alert':''}">${issues?issues+' flagged readings':'No flagged readings'}</span></div><p class="note">${count} of ${v.readings.length} results entered · ${v.photos.length} photo(s)</p>`)}<div class="grid2">${btn('Edit results',"go('test')",'ghost')}${btn('📄 View report',"go('report')")}</div>${card('Recorded readings',v.readings.map(r=>`<div class="rowline inline"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.unit)}</div></div><div style="text-align:right"><strong>${esc(r.value||'—')}</strong><div class="status ${r.value===''?'':outOfRange(r)?'bad':'ok'}">${r.value===''?'Not recorded':outOfRange(r)?'Out of range':'Recorded'}</div></div></div>`).join(''))}`}
function outOfRange(r){if(r.value===''||!Number.isFinite(Number(r.value)))return false;const n=Number(r.value);return (r.min!=null&&n<r.min)||(r.max!=null&&n>r.max)}
function report(){let v=visit();if(!v)return go('visits');head('Report preview','Print or save as PDF from Safari');const entered=v.readings.filter(r=>r.value!=='');const flagged=entered.filter(outOfRange);const photos=v.photos.map((p,i)=>`<img src="${p}" alt="Site photograph ${i+1}">`).join('');$('main').innerHTML=`<div class="noprint grid2">${btn('← Edit results',"go('test')",'ghost')}${btn('Print / Save PDF','window.print()')}</div><section class="card report" id="printreport"><div class="rhead"><strong>💧 AquaOps <span style="color:#05a59c">Pro</span></strong><span>FIELD SERVICE REPORT</span></div><h2>${esc(v.type)} Service Report</h2><table><tr><th>Site</th><td>${esc(v.siteName)}</td></tr><tr><th>Visit date</th><td>${fmt(v.date)}</td></tr><tr><th>System type</th><td>${esc(v.type)}</td></tr><tr><th>Results requiring review</th><td>${flagged.length} of ${entered.length} recorded readings</td></tr></table><h3>Water analysis results</h3><table><tr><th>Parameter</th><th>Result</th><th>Configured limits</th><th>Status</th></tr>${v.readings.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.value||'—')} ${esc(r.unit)}</td><td>${r.min==null?'—':esc(r.min)} to ${r.max==null?'—':esc(r.max)}</td><td>${r.value===''?'Not tested':outOfRange(r)?'Review':'Within limits*'}</td></tr>`).join('')}</table><h3>Observations</h3><p>${esc(v.notes||'None recorded.')}</p><h3>Corrective actions</h3><p>${esc(v.actions||'None recorded.')}</p>${photos?`<h3>Site photographs</h3><div class="rphotos">${photos}</div>`:''}<div class="sig">Engineer signature: _________________________________ &nbsp; Date: _______________</div><p class="note">* Limits are user-configured, and require site-specific professional validation. This prototype does not certify ACOP L8 / HSG274 compliance.</p></section><div class="noprint">${btn('Print or Save PDF','window.print()')}</div>`}
function calculator(){head('Dosing calculator','Demonstration — engineering verification required');$('main').innerHTML=`${card('Concentration adjustment',`${field('volume','System volume (L)',10000,'number','step="any" min="0"')}${field('current','Current concentration (mg/L)',20,'number','step="any"')}${field('target','Target concentration (mg/L)',50,'number','step="any"')}${field('strength','Active ingredient by mass (%)',25,'number','step="any" min="0" max="100"')}${field('density','Product density (kg/L)',1.1,'number','step="any" min="0"')}<p class="note">Assumes complete mixing, concentration expressed as mg/L active ingredient, and no demand, loss or reaction. Does not apply to every chemical or treatment programme.</p>${btn('Calculate dose','calculate()')}<div id="calcresult" style="margin-top:15px"></div>`)}`}
function calculate(){let [vol,cur,tgt,str,den]=['volume','current','target','strength','density'].map(id=>Number($(id).value));if(![vol,cur,tgt,str,den].every(Number.isFinite)||vol<=0||str<=0||str>100||den<=0||tgt<cur){$('calcresult').innerHTML='<div class="notice">Enter valid positive volume, density and strength; target must be at least current concentration.</div>';return}let massmg=(tgt-cur)*vol;let litres=massmg/1e6/(str/100)/den;$('calcresult').innerHTML=`<div class="metric"><span>Theoretical neat product volume</span><strong>${litres.toFixed(3)} L</strong><span>${(litres*1000).toFixed(0)} mL of formulated product</span></div><p class="note">For preliminary planning only. Verify chemical basis, density, product specification, compatibility, dosing method and site risk assessment.</p>`}
function settings(){head('Settings & information','Manage demonstration data');$('main').innerHTML=`${card('About AquaOps Pro',`<p>Safari prototype v0.1</p><p class="note">This is an offline-friendly single-page demo. No account, server synchronisation, subscription payment, regulatory certification or automated emails have been implemented.</p>`)}${card('Data controls',`${btn('Export backup (JSON)','backup()','ghost')}<p class="note">Backup includes customer details, visits and photographs. Keep it secure.</p><div class="field"><label>Restore JSON backup</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div>${btn('Reset all demo data','resetAll()','danger')}`)}`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aquaops-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function restore(ev){let f=ev.target.files[0];if(!f)return;f.text().then(x=>{let data=JSON.parse(x);if(!Array.isArray(data.sites)||!Array.isArray(data.visits))throw Error('Invalid backup');if(confirm('Replace local data with this backup?')){db=data;persist();go('dashboard')}}).catch(()=>alert('Backup is invalid'))}function resetAll(){if(confirm('Delete all local sites, visits and photos and restore sample sites?')){localStorage.removeItem(KEY);location.reload()}}
// AquaOps Pro v0.2: one site -> many assets; configurable report branding; touch signature.
function upgradeV2(){
  db.branding ||= {company:'',reportTitle:'',footer:'',logo:''};
  db.sites.forEach(s=>{if(!Array.isArray(s.assets)){s.assets=[{id:sid(),name:s.type==='Cooling Tower'?'Cooling Tower 1':s.type+' 1',type:s.type,params:s.params||paramsFor(s.type)}]}});
  db.sites.forEach(s=>{if(s.name==='Thomas Hardy – Warrington' && s.assets.length===1 && s.assets[0].type==='Cooling Tower' && !s.assets.some(a=>a.type==='Pasteuriser')){s.assets[0].name='Cooling Tower 1';for(let i=1;i<=3;i++)s.assets.push({id:sid(),name:'Pasteuriser '+i,type:'Pasteuriser',params:paramsFor('Pasteuriser')});for(let i=1;i<=2;i++)s.assets.push({id:sid(),name:'Boiler '+i,type:'Boiler',params:paramsFor('Boiler')})}});
  db.visits.forEach(v=>{if(!v.assetId){let s=db.sites.find(x=>x.id===v.siteId);v.assetId=s?.assets.find(a=>a.type===v.type)?.id||s?.assets[0]?.id||'';v.assetName=s?.assets.find(a=>a.id===v.assetId)?.name||v.type}v.customerName ||= '';v.customerSignature ||= ''});
  persist();
}
function assetOf(s,id){return s?.assets?.find(a=>a.id===id)}
function dashboard(){head('Dashboard','Your field engineering workspace');let due=db.visits.filter(v=>v.actions?.trim()).length;let recent=db.visits.slice(-3).reverse();let assets=db.sites.reduce((n,s)=>n+s.assets.length,0);$('main').innerHTML=`<div class="grid2"><div class="metric"><span>Customer sites</span><strong>${db.sites.length}</strong><span>Ready to visit</span></div><div class="metric"><span>Plant assets</span><strong>${assets}</strong><span>Individually tracked</span></div><div class="metric"><span>Reports saved</span><strong>${db.visits.length}</strong><span>On this device</span></div><div class="metric"><span>Reports with actions</span><strong>${due}</strong><span>Follow up as needed</span></div></div>${card('Quick actions',`<div class="grid2">${btn('＋ New site',"go('siteEdit',null)")}${btn('🧪 Record visit',"go('sites')",'ghost')}${btn('⚗ Dosing calculator',"go('calculator')",'ghost')}${btn('⚙ Report branding',"go('branding')",'ghost')}</div>`)}${card('Recent visits',recent.map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${esc(v.assetName)} · ${fmt(v.date)}</div></div>${btn('View',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits yet.</div>')}<div class="notice">Demo readings and default limits are illustrative only. They must be validated for each system. This prototype is not certified for regulatory compliance.</div>`}
function sites(){head('Customer sites','Manage locations and individual assets');$('main').innerHTML=`${btn('＋ Add customer site',"go('siteEdit',null)")}${card('All sites',db.sites.map(s=>`<div class="rowline inline"><div><strong>${esc(s.name)}</strong><div class="muted">${s.assets.length} asset${s.assets.length===1?'':'s'} · ${esc(s.assets.map(a=>a.type).join(', '))}</div></div>${btn('Open',`go('siteDetail','${s.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">Add your first site.</div>')}`}
function siteDetail(){const s=site();if(!s)return go('sites');head(s.name,`${s.assets.length} assets · Individual service histories`);let items=s.assets.map(a=>{let vv=db.visits.filter(v=>v.assetId===a.id).sort((x,y)=>y.date.localeCompare(x.date));return `<div class="rowline"><div class="inline"><div><strong>${esc(a.name)}</strong><div style="margin-top:6px"><span class="chip">${esc(a.type)}</span></div><div class="muted" style="margin-top:7px">${vv.length} recorded visit${vv.length===1?'':'s'}${vv[0]?' · Last: '+fmt(vv[0].date):''}</div></div></div><div class="grid2" style="margin-top:12px">${btn('Start test',`startVisit('${s.id}','${a.id}')`,'small')}${btn('Edit asset',`editAsset('${a.id}')`,'small ghost')}</div></div>`}).join('');$('main').innerHTML=`${card('Site',`<p class="note">${esc(s.notes||'No site notes added.')}</p><div class="grid2">${btn('＋ Add asset','editAsset(null)')}${btn('Edit site',"go('siteEdit')",'ghost')}</div>`)}${card('Equipment and assets',items||'<div class="empty">No assets added. Add your first piece of plant.</div>')}${card('Recent reports',db.visits.filter(v=>v.siteId===s.id).slice(-10).reverse().map(v=>`<div class="rowline inline"><div><strong>${esc(v.assetName)}</strong><div class="muted">${fmt(v.date)} · ${esc(v.type)}</div></div>${btn('Report',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No reports yet.</div>')}`}
function siteEdit(){const s=site();head(s?'Edit customer site':'New customer site','One location can contain multiple assets');$('main').innerHTML=`${card('Site details',field('sitename','Customer / site name',s?.name||'')+`<div class="field"><label>Site notes</label><textarea id="sitenotes">${esc(s?.notes||'')}</textarea></div>`)}<div class="grid2">${btn('Save site','saveSite()')}${btn('Cancel',"go('sites')",'ghost')}</div><p class="note">After saving, add any number of boilers, pasteurisers, cooling towers or other assets, each with its own test parameters and reports.</p>`}
function saveSite(){let name=$('sitename').value.trim();if(!name)return alert('Enter a site name');let old=site();let obj=old?{...old,name,notes:$('sitenotes').value.trim()}:{id:sid(),name,notes:$('sitenotes').value.trim(),assets:[]};let i=db.sites.findIndex(s=>s.id===obj.id);if(i>=0)db.sites[i]=obj;else db.sites.push(obj);persist();go('siteDetail',obj.id)}
let activeAssetId=null;
function editAsset(id){activeAssetId=id;state.page='assetEdit';render();window.scrollTo(0,0)}
function assetEdit(){const s=site();if(!s)return go('sites');const a=assetOf(s,activeAssetId);head(a?'Edit asset':'Add asset',s.name);$('main').innerHTML=`${card('Asset details',field('assetname','Asset name / reference',a?.name||'')+`<div class="field"><label>System type</label><select id="assettype" onchange="assetTypeChanged()">${TYPES.map(t=>`<option ${a?.type===t?'selected':''}>${t}</option>`).join('')}</select></div>`)}${card('Test parameters and limits',`<div id="parameter-fields"></div>${btn('＋ Add parameter','addParameter()','small ghost')}<p class="note">Settings apply to this individual asset only. Blank limits mean not assessed.</p>`)}<div class="grid2">${btn('Save asset','saveAsset()')}${btn('Cancel',"go('siteDetail')",'ghost')}</div>`;drawParams(a?.params||paramsFor(TYPES[0]))}
function assetTypeChanged(){if(confirm('Replace parameters with illustrative defaults for this type?'))drawParams(paramsFor($('assettype').value))}
function saveAsset(){const s=site();if(!s)return;const name=$('assetname').value.trim();if(!name)return alert('Enter an asset name');const a={id:activeAssetId||sid(),name,type:$('assettype').value,params:readParams()};const i=s.assets.findIndex(x=>x.id===a.id);if(i>=0)s.assets[i]=a;else s.assets.push(a);persist();go('siteDetail')}
function startVisit(id,assetId){let s=db.sites.find(x=>x.id===id),a=assetOf(s,assetId);if(!a)return alert('Please select an asset');let v={id:sid(),siteId:s.id,siteName:s.name,assetId:a.id,assetName:a.name,type:a.type,date:date(),readings:a.params.map(p=>({...p,value:''})),notes:'',actions:'',photos:[],customerName:'',customerSignature:''};db.visits.push(v);persist();go('test',id,v.id)}
function visits(){head('Visit history','Reports linked to the correct asset');$('main').innerHTML=`${btn('＋ Start new asset visit',"go('sites')")}${card('Saved visits',db.visits.slice().reverse().map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${esc(v.assetName)} · ${fmt(v.date)}</div></div>${btn('Open',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits yet.</div>')}`}
let sigDrawing=false,sigTouched=false;
function signatureCard(v){return card('Customer sign-off',`<p class="note">Ask the customer to sign using their finger. Signing acknowledges the visit/report, not regulatory compliance.</p>${field('customerName','Customer name',v.customerName||'')}<canvas id="signaturePad" class="signature-pad" aria-label="Customer signature drawing surface"></canvas><div class="grid2">${btn('Clear signature','clearSignature()','small ghost')}${btn('Save signature','saveSignature()','small')}</div><div class="muted" id="sigStatus" style="margin-top:7px">${v.customerSignature?'Signature saved':'Not signed'}</div>`)}
function initSignature(){const c=$('signaturePad');if(!c)return;const ctx=c.getContext('2d');const ratio=window.devicePixelRatio||1;c.width=Math.round(c.clientWidth*ratio);c.height=Math.round(155*ratio);ctx.scale(ratio,ratio);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#163f65';sigTouched=false;if(visit()?.customerSignature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,155);im.src=visit().customerSignature}const point=e=>{let b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);sigDrawing=true;sigTouched=true;let [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};c.onpointermove=e=>{if(!sigDrawing)return;let [x,y]=point(e);ctx.lineTo(x,y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>sigDrawing=false}
function clearSignature(){let c=$('signaturePad');if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);sigTouched=true;$('sigStatus').textContent='Signature cleared — save to confirm'}
function saveSignature(){let v=visit(),c=$('signaturePad');if(!v||!c)return;v.customerName=$('customerName').value.trim();v.customerSignature=c.toDataURL('image/png');persist();$('sigStatus').textContent='Signature saved to this visit';sigTouched=false}
function test(){const v=visit();if(!v)return go('visits');head('Record test results',`${v.siteName} · ${v.assetName}`);$('main').innerHTML=`${card('Visit details',field('testdate','Visit date',v.date,'date')+`<div class="muted">${esc(v.type)} · ${v.readings.length} parameters</div>`)}${card('Water test results',v.readings.map((r,i)=>`<div class="testrow"><label for="reading${i}">${esc(r.name)}</label><input id="reading${i}" type="number" step="any" value="${esc(r.value)}" placeholder="—"><span>${esc(r.unit)}</span></div>`).join(''))}${card('Engineer observations',`<div class="field"><label>Visit notes</label><textarea id="notes">${esc(v.notes)}</textarea></div><div class="field"><label>Required corrective actions</label><textarea id="actions">${esc(v.actions)}</textarea></div>`)}${card('Site photographs',`<p class="note">Photographs are associated with this asset's visit.</p><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event)"><div class="photos" id="photoList">${v.photos.map((p,i)=>`<img class="photo" src="${p}" alt="Site photograph ${i+1}">`).join('')}</div>`)}${signatureCard(v)}<div class="grid2">${btn('Save visit','saveTest()')}${btn('Preview report','saveTest(true)','ghost')}</div>`;requestAnimationFrame(initSignature)}
function saveTest(preview=false){let v=visit();if(!v)return;v.date=$('testdate').value;v.readings.forEach((r,i)=>r.value=$('reading'+i).value);v.notes=$('notes').value;v.actions=$('actions').value;if($('customerName'))v.customerName=$('customerName').value.trim();if(sigTouched&&$('signaturePad'))v.customerSignature=$('signaturePad').toDataURL('image/png');persist();preview?go('report'):go('visitDetail',null,v.id)}
function visitDetail(){let v=visit();if(!v)return go('visits');head('Saved asset visit',`${v.siteName} · ${v.assetName}`);let count=v.readings.filter(x=>x.value!=='').length,issues=v.readings.filter(outOfRange).length;$('main').innerHTML=`${card('Visit summary',`<div class="inline"><div><strong>${fmt(v.date)}</strong><div class="muted">${esc(v.assetName)} · ${esc(v.type)}</div></div><span class="chip ${issues?'alert':''}">${issues?issues+' flagged readings':'No flagged readings'}</span></div><p class="note">${count} of ${v.readings.length} results entered · ${v.photos.length} photo(s) · ${v.customerSignature?'Customer signed':'Unsigned'}</p>`)}<div class="grid2">${btn('Edit results',"go('test')",'ghost')}${btn('📄 View report',"go('report')")}</div>${card('Recorded readings',v.readings.map(r=>`<div class="rowline inline"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.unit)}</div></div><div style="text-align:right"><strong>${esc(r.value||'—')}</strong><div class="status ${r.value===''?'':outOfRange(r)?'bad':'ok'}">${r.value===''?'Not recorded':outOfRange(r)?'Out of range':'Recorded'}</div></div></div>`).join(''))}`}
function branding(){head('Report branding','Customise PDFs for your company');let b=db.branding||{};$('main').innerHTML=`${card('Company identity',`${field('brandCompany','Company name',b.company||'')}${field('brandTitle','Custom report title (optional)',b.reportTitle||'')}<div class="field"><label>Company logo (PNG or JPG)</label><input id="logoFile" type="file" accept="image/png,image/jpeg" onchange="uploadLogo(event)"></div><div id="logoPreview">${b.logo?`<img class="logo-preview" src="${b.logo}" alt="Company logo">`:''}</div><div class="field"><label>Report footer text</label><textarea id="brandFooter" placeholder="Company contact details or disclaimer">${esc(b.footer||'')}</textarea></div>${btn('Save report branding','saveBranding()')}<p class="note">Your branding is saved in this browser only. Don't store sensitive company data in this prototype.</p>`)}`}
function uploadLogo(event){let f=event.target.files?.[0];if(!f)return;let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas');let k=Math.min(1,600/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.branding.logo=c.toDataURL('image/png');persist();$('logoPreview').innerHTML=`<img class="logo-preview" src="${db.branding.logo}" alt="Company logo">`;URL.revokeObjectURL(url)};im.onerror=()=>alert('Unable to read image');im.src=url}
function saveBranding(){db.branding.company=$('brandCompany').value.trim();db.branding.reportTitle=$('brandTitle').value.trim();db.branding.footer=$('brandFooter').value.trim();persist();alert('Branding saved for future reports')}
function settings(){head('Settings & information','Manage demo data and company reports');$('main').innerHTML=`${card('Company report setup',`${btn('🏢 Customise branding',"go('branding')")}<p class="note">Upload your logo, set your company name and report footer. Customer signatures can be captured during each visit.</p>`)}${card('About AquaOps Pro',`<p>Safari prototype v0.2</p><p class="note">This demonstration stores all data locally in your browser. No team accounts, cloud sync, subscriptions, verified legal compliance or server backups.</p>`)}${card('Data controls',`${btn('Export backup (JSON)','backup()','ghost')}<p class="note">Backup includes site and asset data, photos, logos and signatures; protect this file.</p><div class="field"><label>Restore JSON backup</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div>${btn('Reset all demo data','resetAll()','danger')}`)}`}
function report(){let v=visit();if(!v)return go('visits');head('Report preview',`${v.siteName} · ${v.assetName}`);let b=db.branding||{},entered=v.readings.filter(r=>r.value!==''),flagged=entered.filter(outOfRange),photos=v.photos.map((p,i)=>`<img src="${p}" alt="Site photograph ${i+1}">`).join('');$('main').innerHTML=`<div class="noprint grid2">${btn('← Edit results',"go('test')",'ghost')}${btn('Print / Save PDF','window.print()')}</div><section class="card report" id="printreport"><div class="rhead"><div>${b.logo?`<img class="report-logo" src="${b.logo}" alt="Company logo">`:'💧'} <strong>${esc(b.company||'AquaOps Pro')}</strong></div><span>SERVICE REPORT</span></div><h2>${esc(b.reportTitle||v.type+' Service Report')}</h2><table><tr><th>Customer site</th><td>${esc(v.siteName)}</td></tr><tr><th>Asset / equipment</th><td>${esc(v.assetName||v.type)}</td></tr><tr><th>System type</th><td>${esc(v.type)}</td></tr><tr><th>Visit date</th><td>${fmt(v.date)}</td></tr><tr><th>Readings requiring review</th><td>${flagged.length} of ${entered.length} recorded</td></tr></table><h3>Water analysis results</h3><table><tr><th>Parameter</th><th>Result</th><th>Configured limits</th><th>Status</th></tr>${v.readings.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.value||'—')} ${esc(r.unit)}</td><td>${r.min==null?'—':esc(r.min)} to ${r.max==null?'—':esc(r.max)}</td><td>${r.value===''?'Not tested':outOfRange(r)?'Review':'Within configured limits*'}</td></tr>`).join('')}</table><h3>Observations</h3><p>${esc(v.notes||'None recorded.')}</p><h3>Corrective actions</h3><p>${esc(v.actions||'None recorded.')}</p>${photos?`<h3>Site photographs</h3><div class="rphotos">${photos}</div>`:''}<h3>Customer acknowledgment</h3><div class="signoff"><div><strong>Customer name:</strong> ${esc(v.customerName||'______________________')}</div><div><strong>Signature:</strong><div>${v.customerSignature?`<img class="report-signature" src="${v.customerSignature}" alt="Customer signature">`:'________________________________'}</div></div><div><strong>Date:</strong> ${fmt(v.date)}</div></div><div class="sig">Engineer signature: _________________________________ &nbsp; Date: _______________</div>${b.footer?`<p class="report-footer">${esc(b.footer)}</p>`:''}<p class="note">* Limits are user-configured and require professional validation for each asset. Signature acknowledges receipt/attendance only. This prototype does not certify ACOP L8 / HSG274 compliance.</p></section><div class="noprint">${btn('Print or Save PDF','window.print()')}</div>`}
const oldRender=render;
render=function(){drawNav();const pages={dashboard,sites,siteDetail,siteEdit,assetEdit,visits,test,visitDetail,calculator,settings,branding,report};(pages[state.page]||dashboard)()};

// AquaOps Pro v0.3 enhancements. All data is kept in the existing local storage record.
const REPORT_PARTS=[['summary','Executive summary'],['assets','Asset overview'],['tests','Water test tables'],['trends','Previous-reading comparison'],['notes','Engineer observations'],['actions','Corrective action register'],['photos','Site photographs'],['signatures','Customer signatures'],['disclaimer','Engineering disclaimer']];
let reportSiteId=null, reportSelection={}, reportDocMode='site';
function upgradeV3(){db.branding ||= {};let b=db.branding;b.accent ||= '#087c9d';b.sections ||= REPORT_PARTS.map(x=>x[0]);b.showEmpty ||= false;b.reportTitleSite ||= 'Consolidated Water Treatment Service Report';b.engineer ||= '';b.companyAddress ||= '';db.sites.forEach(s=>{s.assets||=[];s.nextDue||='';});db.visits.forEach(v=>{v.photos||=[];v.readings||=[];v.customerName||='';v.customerSignature||='';v.actions||='';});persist()}
function colorsafe(s){return /^#[0-9a-fA-F]{6}$/.test(s||'')?s:'#087c9d'}
function sortedSiteVisits(s){return db.visits.filter(v=>v.siteId===s.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || String(b.id).localeCompare(String(a.id)))}
function reportDefaults(s){let grouped={};for(let v of sortedSiteVisits(s)){if(!grouped[v.assetId])grouped[v.assetId]=v.id}return grouped}
function reportBuilder(siteid){const s=db.sites.find(x=>x.id===siteid);if(!s)return go('sites');state.site=s.id;state.page='reportBuilder';reportSiteId=s.id;reportSelection=reportDefaults(s);render();window.scrollTo(0,0)}
function reportBuilderPage(){const s=site();if(!s)return go('sites');head('Site report builder',s.name);let vlist=sortedSiteVisits(s),parts=db.branding.sections||REPORT_PARTS.map(x=>x[0]);$('main').innerHTML=`${card('Consolidated site report',`<p class="note">Choose the visit to include for each asset. Each asset appears in its own section, followed by a site-wide action summary. Only saved visits are included.</p><div class="grid2">${btn('Report settings',"go('branding')",'ghost')}${btn('Generate preview','openSiteReport()')}</div>`)}${card('Select assets and visits',s.assets.map(a=>{let opts=vlist.filter(v=>v.assetId===a.id);return `<div class="rowline"><strong>${esc(a.name)}</strong> <span class="chip">${esc(a.type)}</span><div class="muted" style="margin:5px 0">${opts.length} recorded visit(s)</div><select id="assetvisit-${esc(a.id)}" aria-label="Visit for ${esc(a.name)}"><option value="">Exclude this asset</option>${opts.map(v=>`<option value="${esc(v.id)}" ${reportSelection[a.id]===v.id?'selected':''}>${esc(v.date)} · ${v.readings.filter(r=>r.value!=='').length} readings</option>`).join('')}</select></div>`}).join('')||'<p>No assets added.</p>')}${card('Report notes',`<p class="note">For the current prototype, the executive summary is generated from the selected tests. Change branding, included sections, colour and section ordering under Report settings.</p>${btn('Preview combined report','openSiteReport()')}`)}`}
function openSiteReport(){const s=site();if(!s)return;for(let a of s.assets){let inp=$('assetvisit-'+a.id);if(inp)reportSelection[a.id]=inp.value}if(!Object.values(reportSelection).some(Boolean))return alert('Save a visit for at least one asset, then select it here.');reportDocMode='site';go('siteReport',s.id)}
function selectedSiteVisits(s){return s.assets.map(a=>db.visits.find(v=>v.id===reportSelection[a.id]&&v.siteId===s.id&&v.assetId===a.id)).filter(Boolean)}
function latestPrevious(v){return db.visits.filter(x=>x.assetId===v.assetId&&x.id!==v.id&&x.date<=v.date).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]}
function trHTML(v){let prev=latestPrevious(v);if(!prev)return '<p class="note">No previous reading available for comparison.</p>';let rows=v.readings.filter(r=>r.value!==''&&Number.isFinite(Number(r.value))).map(r=>{let old=prev.readings.find(p=>p.name===r.name);if(!old||old.value===''||!Number.isFinite(Number(old.value)))return '';let d=Number(r.value)-Number(old.value);return `<tr><td>${esc(r.name)}</td><td>${esc(old.value)} ${esc(r.unit)}</td><td>${esc(r.value)} ${esc(r.unit)}</td><td>${d>0?'+':''}${Number(d.toFixed(2))}</td></tr>`}).filter(Boolean).join('');return rows?`<table><thead><tr><th>Parameter</th><th>Previous</th><th>Current</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="note">No matching numeric parameters for comparison.</p>'}
function rTable(v){return `<table><thead><tr><th>Test</th><th>Reading</th><th>Configured range</th><th>Status</th></tr></thead><tbody>${v.readings.map(r=>{let limits=r.min==null&&r.max==null?'Not configured':`${r.min==null?'—':esc(r.min)} – ${r.max==null?'—':esc(r.max)}`;let status=r.value===''?'Not tested':r.min==null&&r.max==null?'No range':outOfRange(r)?'Review':'Within range';return `<tr><td>${esc(r.name)}</td><td>${esc(r.value||'—')} ${esc(r.unit)}</td><td>${limits}</td><td class="${status==='Review'?'flagged':''}">${status}</td></tr>`}).join('')}</tbody></table>`}
function imageSection(v){return v.photos.length?`<div class="rphotos">${v.photos.map((p,i)=>`<figure><img src="${p}" alt="Asset photo"><figcaption>${esc(v.assetName)} · Photograph ${i+1}</figcaption></figure>`).join('')}</div>`:'<p class="note">No photographs recorded.</p>'}
function signSection(v){return `<div class="signoff"><div><strong>${esc(v.assetName)}</strong><div>Customer: ${esc(v.customerName||'Not supplied')}</div><div>${v.customerSignature?`<img class="report-signature" src="${v.customerSignature}" alt="Customer signature">`:'Not signed'}</div><div>Date: ${esc(v.date)}</div></div></div>`}
function reportHead(title,s,vs){let b=db.branding;return `<div class="rhead"><div>${b.logo?`<img class="report-logo" src="${b.logo}" alt="Company logo">`:'💧'} <strong>${esc(b.company||'AquaOps Pro')}</strong></div><span>ENGINEERING SERVICE REPORT</span></div><h2 style="color:var(--reportaccent)">${esc(title)}</h2><table><tbody><tr><th>Customer site</th><td>${esc(s.name)}</td></tr><tr><th>Report prepared</th><td>${fmt(date())}</td></tr><tr><th>Assets included</th><td>${vs.length} of ${s.assets.length}</td></tr>${b.engineer?`<tr><th>Engineer</th><td>${esc(b.engineer)}</td></tr>`:''}${b.companyAddress?`<tr><th>Company details</th><td>${esc(b.companyAddress)}</td></tr>`:''}</tbody></table>`}
function reportSection(id,vs,s){switch(id){case 'summary':{let flagged=vs.flatMap(v=>v.readings.filter(r=>r.value!==''&&outOfRange(r))).length;let missing=vs.flatMap(v=>v.readings.filter(r=>r.value==='')).length;return `<h3>Executive summary</h3><p>${vs.length} assets assessed across ${new Set(vs.map(v=>v.type)).size} system types. ${flagged} result(s) outside user-configured ranges; ${missing} test(s) not recorded. ${vs.filter(v=>v.actions?.trim()).length} asset visit(s) with corrective-action notes.</p><p class="note">This is a summary of recorded data, not a compliance certification.</p>`}case 'assets':return `<h3>Asset overview</h3><table><tr><th>Asset</th><th>Type</th><th>Visit date</th><th>Review</th></tr>${vs.map(v=>`<tr><td>${esc(v.assetName)}</td><td>${esc(v.type)}</td><td>${esc(v.date)}</td><td>${v.readings.filter(r=>r.value!==''&&outOfRange(r)).length} flagged</td></tr>`).join('')}</table>`;case 'tests':return `<h3>Asset water test results</h3>${vs.map(v=>`<div class="asset-report"><h4>${esc(v.assetName)} <span class="muted">${esc(v.type)} · ${esc(v.date)}</span></h4>${rTable(v)}</div>`).join('')}`;case 'trends':return `<h3>Previous-reading comparison</h3>${vs.map(v=>`<div class="asset-report"><h4>${esc(v.assetName)}</h4>${trHTML(v)}</div>`).join('')}`;case 'notes':return `<h3>Engineer observations</h3>${vs.map(v=>`<p><strong>${esc(v.assetName)}:</strong> ${esc(v.notes||'None recorded.')}</p>`).join('')}`;case 'actions':return `<h3>Corrective action register</h3>${vs.some(v=>v.actions?.trim())?`<table><tr><th>Asset</th><th>Action / recommendation</th></tr>${vs.filter(v=>v.actions?.trim()).map(v=>`<tr><td>${esc(v.assetName)}</td><td>${esc(v.actions)}</td></tr>`).join('')}</table>`:'<p>No actions recorded in the selected visits.</p>'}`;case 'photos':return `<h3>Photographic evidence</h3>${vs.map(v=>`<div class="asset-report"><h4>${esc(v.assetName)}</h4>${imageSection(v)}</div>`).join('')}`;case 'signatures':return `<h3>Customer acknowledgement</h3>${vs.map(signSection).join('')}<p class="note">Customer signatures acknowledge attendance or receipt only, not acceptance of compliance.</p>`;case 'disclaimer':return `<h3>Important information</h3><p class="note">Test limits are user-defined examples or site-specific settings and are not independently verified. Chemical dosing, control ranges and any ACOP L8/HSG274-related decisions require competent professional review. This prototype does not establish regulatory compliance.</p>`;default:return ''}}
function builtReport(vs,s,title){let b=db.branding||{};return `<section class="card report pro-report" id="printreport" style="--reportaccent:${colorsafe(b.accent)}">${reportHead(title,s,vs)}${(b.sections||REPORT_PARTS.map(x=>x[0])).map(id=>reportSection(id,vs,s)).join('')}${b.footer?`<p class="report-footer">${esc(b.footer)}</p>`:''}<p class="muted" style="font-size:10px">AquaOps Pro prototype · Locally generated on ${fmt(date())}</p></section>`}
function siteReport(){const s=site();if(!s)return go('sites');let vs=selectedSiteVisits(s);head('Combined site report',`${s.name} · ${vs.length} assets`);$('main').innerHTML=`<div class="noprint grid2">${btn('← Select visits',"go('reportBuilder')",'ghost')}${btn('Print / Save PDF','window.print()')}</div>${builtReport(vs,s,db.branding.reportTitleSite||'Consolidated Service Report')}<div class="noprint">${btn('Print / Save PDF','window.print()')}</div>`}
function report(){let v=visit();if(!v)return go('visits');let s=db.sites.find(x=>x.id===v.siteId)||{name:v.siteName,assets:[]};head('Asset report',`${v.siteName} · ${v.assetName}`);$('main').innerHTML=`<div class="noprint grid2">${btn('← Edit visit',"go('test')",'ghost')}${btn('Print / Save PDF','window.print()')}</div>${builtReport([v],s,db.branding.reportTitle||v.type+' Service Report')}`}
function moveReportSection(index,offset){let a=db.branding.sections;let j=index+offset;if(j<0||j>=a.length)return;[a[index],a[j]]=[a[j],a[index]];persist();reportDesigner()}

function reportDesigner(){head('Report designer','Choose the PDF structure and section order');let b=db.branding,sections=b.sections;$('main').innerHTML=`${card('Report sections',`<p class="note">Change the included sections for both individual and consolidated reports. Use ↑ and ↓ to reorder them.</p>${sections.map((x,i)=>`<div class="rowline inline"><strong>${esc(REPORT_PARTS.find(y=>y[0]===x)?.[1]||x)}</strong><div class="inline" style="justify-content:flex-end">${btn('↑',`moveReportSection(${i},-1)`,'small ghost')}${btn('↓',`moveReportSection(${i},1)`,'small ghost')}${btn('×',`togglePart('${x}',false)`,'small danger')}</div></div>`).join('')}${REPORT_PARTS.filter(p=>!sections.includes(p[0])).map(p=>`<div class="rowline inline"><span>${esc(p[1])}</span>${btn('＋ Include',`togglePart('${p[0]}',true)`,'small ghost')}</div>`).join('')}`)}${card('Appearance',`<div class="field"><label for="reportAccent">Report accent colour</label><input type="color" id="reportAccent" value="${colorsafe(b.accent)}" onchange="db.branding.accent=this.value;persist()"></div><p class="note">Changes appear in PDF previews immediately.</p>${btn('← Branding',"go('branding')",'ghost')}`)}`}

function taskEdit(){let t=db.tasks.find(x=>x.id===editTaskId)||{},siteId=t.siteId||state.taskSite||db.sites[0]?.id||'',s=db.sites.find(x=>x.id===siteId);premiumHead(editTaskId?'Edit corrective action':'New corrective action','Assign, track and document close-out');$('main').innerHTML=`${card('Action details',`<div class="field"><label>Customer site</label><select id="taskSite" onchange="taskSiteChanged()">${db.sites.map(s=>`<option value="${esc(s.id)}" ${s.id===siteId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Asset</label><select id="taskAsset">${(s?.assets||[]).map(a=>`<option value="${esc(a.id)}" ${a.id===(t.assetId||state.taskAsset)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>${field('taskTitle','Action / issue title',t.title||'')}<div class="field"><label>Description and recommended resolution</label><textarea id="taskDescription">${esc(t.description||'')}</textarea></div><div class="grid2">${field('taskOwner','Assigned engineer / owner',t.owner||'')}${field('taskDeadline','Due date',t.due||plusDays(todayLocal(),7),'date')}</div><div class="grid2"><div class="field"><label>Priority</label><select id="taskPriority">${['Low','Medium','High','Critical'].map(p=>`<option ${p===(t.priority||'Medium')?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="taskStatus">${['Open','In progress','Awaiting verification','Closed'].map(x=>`<option ${x===(t.status||'Open')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Closure / verification evidence</label><textarea id="taskEvidence">${esc(t.evidence||'')}</textarea></div><p class="note">The audit history shown here is local-device history and is editable; it is not tamper-evident evidence.</p><div class="grid2">${btn('Save action','saveTask()')}${btn('Cancel',"go('tasks')",'ghost')}</div>`)}`}
function taskSiteChanged(){let s=db.sites.find(s=>s.id===$('taskSite').value);$('taskAsset').innerHTML=(s?.assets||[]).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
function saveTask(){let siteId=$('taskSite').value,assetId=$('taskAsset').value,title=$('taskTitle').value.trim();if(!siteId||!title)return alert('Please enter a customer site and action title.');let t=db.tasks.find(x=>x.id===editTaskId);if(!t){t={id:sid(),created:todayLocal(),history:[]};db.tasks.push(t)}let oldStatus=t.status;t.siteId=siteId;t.assetId=assetId;t.title=title;t.description=$('taskDescription').value.trim();t.owner=$('taskOwner').value.trim();t.due=$('taskDeadline').value;t.priority=$('taskPriority').value;t.status=$('taskStatus').value;t.evidence=$('taskEvidence').value.trim();t.updated=todayLocal();if(oldStatus!==t.status)t.history.push({date:todayLocal(),from:oldStatus||'New',to:t.status});persist();go('tasks')}
function tasks(){premiumHead('Corrective actions','One register across all customer sites');let filtered=db.tasks.filter(t=>taskFilter==='All'||(taskFilter==='Open'?t.status!=='Closed':t.status===taskFilter)).sort((a,b)=>(a.status==='Closed')-(b.status==='Closed')||String(a.due).localeCompare(String(b.due)));$('main').innerHTML=`<div class="noprint">${btn('＋ New corrective action','newTask()')}<div class="filter-row" style="margin-top:14px">${['Open','In progress','Awaiting verification','Closed','All'].map(f=>`<button class="filter-pill ${f===taskFilter?'selected':''}" onclick="taskFilter='${f}';tasks()">${f}</button>`).join('')}</div></div>${card('Action register',filtered.map(t=>{let s=db.sites.find(x=>x.id===t.siteId),a=s?.assets.find(x=>x.id===t.assetId);return `<div class="rowline"><div class="task-head"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(s?.name||'Unknown site')} · ${esc(a?.name||'Site wide')}</div></div><span class="${t.status==='Closed'?'badge-good':daysUntil(t.due)<0?'badge-overdue':'badge-due'}">${esc(t.status)}</span></div><p class="note">${esc(t.description||'No details entered.')}</p><div class="premium-flex"><span class="asset-type">${esc(t.priority)} priority</span><span class="asset-type">${t.due?'Due '+fmt(t.due):'No deadline'}</span><span class="asset-type">${esc(t.owner||'Unassigned')}</span></div><div style="margin-top:12px">${btn('Review / update',`editTask('${t.id}')`,'small ghost')}</div></div>`}).join('')||'<div class="empty-state"><div class="big">✓</div>No actions in this view.</div>')}`}
function insights(){premiumHead('Asset intelligence','Historical performance across your portfolio');let assets=db.sites.flatMap(s=>s.assets.map(a=>({s,a,count:assetVisits(a).length}))).sort((a,b)=>b.count-a.count);$('main').innerHTML=`${card('Most active equipment',assets.map(x=>`<div class="rowline inline"><div><strong>${esc(x.a.name)}</strong><div class="muted">${esc(x.s.name)} · ${x.count} recorded visits</div></div>${btn('Trends',`viewAsset('${x.s.id}','${x.a.id}')`,'small ghost')}</div>`).join(''))}${card('Portfolio data',`<p class="note">Compare site-specific readings over time, detect recurring flagged values and export results for Excel analysis.</p><div class="grid2">${btn('Export readings CSV','exportCsv()')}${btn('Visit planner',"go('planner')",'ghost')}</div>`)}`}
function pickTemplate(t){db.branding.template=t;let presets={executive:['summary','assets','tests','trends','notes','actions','photos','signatures','disclaimer'],technical:['summary','assets','tests','trends','actions','notes','photos','signatures','disclaimer'],compact:['summary','assets','tests','actions','signatures','disclaimer']};db.branding.sections=presets[t].slice();persist();reportDesigner()}
function premiumReportDesigner(){premiumHead('Report studio','Branded documents tailored to every customer');let template=db.branding.template||'executive',b=db.branding;$('main').innerHTML=`${card('Report layout presets',`<p class="note">Choose a layout, then personalise its order and sections below.</p>${[['executive','Executive','Detailed site overview, photographs and client sign-off'],['technical','Technical','Engineering results, comparisons and corrective actions'],['compact','Compact','Concise field-service report with essential details']].map(x=>`<button class="template-card ${template===x[0]?'selected':''}" onclick="pickTemplate('${x[0]}')"><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></button>`).join('')}`)}${card('Document branding',`<p class="note">Company logos, headers, footers and engineer details can be edited in Company Branding.</p><div class="color-swatches">${['#087c9d','#0b7669','#163f78','#8a4a85','#303f52','#bd7c20'].map(c=>`<button class="swatch ${colorsafe(b.accent)===c?'active':''}" style="background:${c}" aria-label="Choose ${c} colour" onclick="db.branding.accent='${c}';persist();reportDesigner()"></button>`).join('')}</div><div style="margin-top:15px">${btn('Company branding',"go('branding')",'ghost')}</div>`)}${card('Sections & order',`<p class="note">Move sections to customise the report sequence. Removed sections can be added again.</p>${(b.sections||[]).map((x,i)=>`<div class="rowline inline"><strong style="font-size:13px">${esc(REPORT_PARTS.find(y=>y[0]===x)?.[1]||x)}</strong><div class="inline" style="justify-content:flex-end;gap:4px">${btn('↑',`moveReportSection(${i},-1)`,'small ghost')}${btn('↓',`moveReportSection(${i},1)`,'small ghost')}${btn('×',`togglePart('${x}',false)`,'small danger')}</div></div>`).join('')}${REPORT_PARTS.filter(p=>!b.sections.includes(p[0])).map(p=>`<div class="rowline inline"><span>${esc(p[1])}</span>${btn('＋ Add',`togglePart('${p[0]}',true)`,'small ghost')}</div>`).join('')}`)}`}
function premiumSettings(){premiumHead('Workspace & settings','Your reporting identity and engineering tools');$('main').innerHTML=`${card('Brand & reporting',`<div class="grid2">${btn('Company branding',"go('branding')")}${btn('Report studio',"go('reportDesigner')",'ghost')}${btn('Site report builder',"go('sites')",'ghost')}${btn('Dosing calculator',"go('calculator')",'ghost')}</div>`)}${card('Operations management',`<div class="grid2">${btn('Planner',"go('planner')",'ghost')}${btn('Action tracker',"go('tasks')",'ghost')}${btn('Asset intelligence',"go('insights')",'ghost')}${btn('Export readings CSV','exportCsv()','ghost')}</div>`)}${card('Backup & restore',`<div class="data-warning"><strong>Export before updating your GitHub HTML</strong><p>Your data, logos and signatures are stored in this browser only. Browser clearing, private mode and storage limits can result in data loss.</p></div><div style="margin-top:12px">${btn('Download JSON backup','backup()')}</div><div class="field" style="margin-top:14px"><label>Restore a JSON backup</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div>${btn('Reset demonstration data','resetAll()','danger')}`)}${card('Product status',`<strong>AquaOps Pro Premium Field Edition v${PREMIUM_VERSION}</strong><p class="note">Single-file Safari demo with offline local browser data and printable reports. No subscriptions, authentication, cloud syncing, secure evidence trail, validated chemical dosing or certified ACOP L8 / HSG274 compliance are implemented. Do not store confidential customer data until those foundations are added.</p>`)}`}
// Enhance PDF with an explicit draft indicator and report reference; the original generator and customer signatures remain intact.
const originalBuiltReport=builtReport;
builtReport=function(vs,s,title){let html=originalBuiltReport(vs,s,title);let ref='AO-'+todayLocal().replaceAll('-','')+'-'+String(vs.length).padStart(2,'0');return html.replace('<section class="card report pro-report"',`<section class="card report pro-report premium-pdf"`).replace('</section>',`<p style="font-size:9px;color:#7c8d98;border-top:1px solid #d4e0e7;padding-top:7px">Document reference ${esc(ref)} · Demo report · User-configured test thresholds · Not a certified compliance record</p></section>`)};
// Preserve extra asset metadata when editing a name or its test configuration.
const baseSaveAsset=saveAsset;
saveAsset=function(){let s=site(),existing=s?.assets.find(a=>a.id===activeAssetId),metadata=existing?{serial:existing.serial,location:existing.location,frequencyDays:existing.frequencyDays,nextDue:existing.nextDue}:null;let oldId=activeAssetId;baseSaveAsset();if(metadata&&s){let updated=s.assets.find(a=>a.id===oldId);if(updated){Object.assign(updated,metadata);persist()}}};
// Keep the premium designer visible after reordering or toggling report sections.
reportDesigner=premiumReportDesigner;
// Include explicitly tracked open actions in customer reports, while preserving original visit notes.
const baseReportSection=reportSection;
reportSection=function(id,vs,s){let content=baseReportSection(id,vs,s);if(id==='actions'){let relevant=db.tasks.filter(t=>t.siteId===s.id&&(!t.assetId||vs.some(v=>v.assetId===t.assetId)));if(relevant.length){let rows=relevant.map(t=>{let a=s.assets.find(a=>a.id===t.assetId);return `<tr><td>${esc(a?.name||'Site wide')}</td><td>${esc(t.title)}</td><td>${esc(t.priority)}</td><td>${esc(t.status)}</td><td>${esc(t.due||'—')}</td></tr>`}).join('');content+=`<h4>Assigned corrective actions</h4><div class="scrolltable"><table><thead><tr><th>Asset</th><th>Action</th><th>Priority</th><th>Status</th><th>Due</th></tr></thead><tbody>${rows}</tbody></table></div>`}}return content};
// Restore backups from older versions using the same migration path as normal start-up.
restore=function(ev){let f=ev.target.files?.[0];if(!f)return;f.text().then(raw=>{let data=JSON.parse(raw);if(!Array.isArray(data.sites)||!Array.isArray(data.visits))throw Error('Invalid backup');if(!confirm('Replace all current local records with this backup?'))return;db=data;upgradeV2();upgradeV3();premiumUpgrade();persist();go('dashboard')}).catch(()=>alert('The selected backup could not be restored.'))};

// Render the upgraded navigation and premium screens while preserving the original recording, report and migration functions.
render=function(){premiumNav();const pages={dashboard:premiumDashboard,sites:premiumSites,siteDetail:premiumSiteDetail,siteEdit,assetEdit,assetInsights,planner,visits,test,visitDetail,calculator,settings:premiumSettings,branding,report,reportBuilder:reportBuilderPage,siteReport,reportDesigner:premiumReportDesigner,actionRegister:tasks,tasks,taskEdit,insights};(pages[state.page]||premiumDashboard)()};

/* v1.1 — site-specific parameter evaluation. User-configured amber band: percentage of range.
   For one-sided limits, percentage of absolute limit; a zero boundary has no default band. */
const TRAFFIC_VERSION='1.1';
function trafficAssessment(r,override){
  const value=override===undefined?r.value:override;
  if(value===null||value===undefined||String(value).trim()==='')return {key:'grey',label:'Not tested',reason:'No reading entered'};
  const n=Number(value);
  if(!Number.isFinite(n))return {key:'grey',label:'Invalid',reason:'Enter a numeric reading'};
  const hasMin=r.min!==null&&r.min!==undefined&&String(r.min)!==''&&Number.isFinite(Number(r.min));
  const hasMax=r.max!==null&&r.max!==undefined&&String(r.max)!==''&&Number.isFinite(Number(r.max));
  if(!hasMin&&!hasMax)return {key:'grey',label:'No limits',reason:'No site-specific limits configured'};
  const min=hasMin?Number(r.min):null,max=hasMax?Number(r.max):null;
  if(min!==null&&max!==null&&min>max)return {key:'grey',label:'Invalid limits',reason:'Minimum is above maximum'};
  if((min!==null&&n<min)||(max!==null&&n>max))return {key:'red',label:'Outside limits',reason:'Reading is outside the configured range'};
  const rawPct=r.warningPct===undefined?10:Number(r.warningPct);
  const pct=Number.isFinite(rawPct)?Math.min(50,Math.max(0,rawPct)):10;
  const basis=min!==null&&max!==null?max-min:Math.abs(min!==null?min:max);
  const warningBand=basis*pct/100;
  if(warningBand>0&&((min!==null&&n<=min+warningBand)||(max!==null&&n>=max-warningBand)))return {key:'amber',label:'Approaching limit',reason:`Within the ${pct}% warning band`};
  return {key:'green',label:'Within limits',reason:'Within the configured operating range'};
}
function trafficPill(o){return `<span class="traffic-pill ${o.key}" aria-label="${esc(o.label)}">${esc(o.label)}</span>`}
function trafficRange(r){let low=r.min===null||r.min===undefined||r.min===''?'—':esc(r.min),high=r.max===null||r.max===undefined||r.max===''?'—':esc(r.max);return low==='—'&&high==='—'?'Not configured':`${low} to ${high}${r.unit?' '+esc(r.unit):''}`}
function trafficCounts(vs){const c={green:0,amber:0,red:0,grey:0};vs.forEach(v=>(v.readings||[]).forEach(r=>c[trafficAssessment(r).key]++));return c}
function trafficSummaryHTML(vs){let c=trafficCounts(vs),count=c.green+c.amber+c.red+c.grey;let assessment=c.red?'Action required — outside-limit results':c.amber?'Attention — approaching limits':c.green&&!c.grey?'All assessed readings within configured limits':'Incomplete or unassessed readings';return `<div class="traffic-summary"><div class="traffic-overall">Result overview: ${esc(assessment)}</div><div class="traffic-note">${count} recorded parameter rows across ${vs.length} selected asset visit${vs.length===1?'':'s'}. Every result is assessed against the limits saved with its visit.</div><div class="traffic-key">${trafficPill({key:'green',label:`${c.green} Within`})}${trafficPill({key:'amber',label:`${c.amber} Warning`})}${trafficPill({key:'red',label:`${c.red} Outside`})}${trafficPill({key:'grey',label:`${c.grey} Unassessed`})}</div></div>`}
// Warning bands are part of each asset's parameter configuration. Existing records remain readable.
drawParams=function(params){$('parameter-fields').innerHTML=params.map((p,i)=>`<div class="rowline param" data-i="${i}"><div class="grid2">${field('pn'+i,'Parameter name',p.name)}${field('pu'+i,'Unit',p.unit)}</div><div class="grid2">${field('pmin'+i,'Minimum limit',p.min??'','number','step="any"')}${field('pmax'+i,'Maximum limit',p.max??'','number','step="any"')}</div>${field('pwarn'+i,'Amber warning band (% of permitted range)',p.warningPct??10,'number','min="0" max="50" step="1"')}<p class="traffic-note">0% disables amber for this parameter; readings outside configured limits are always red. For one-sided limits the percentage uses the absolute boundary value.</p>${btn('Remove parameter',`removeParam(${i})`,'small danger')}</div>`).join('')};
readParams=function(){return [...document.querySelectorAll('.param')].map(e=>{let i=e.dataset.i;return {name:$('pn'+i).value.trim(),unit:$('pu'+i).value.trim(),min:$('pmin'+i).value===''?null:Number($('pmin'+i).value),max:$('pmax'+i).value===''?null:Number($('pmax'+i).value),warningPct:Math.max(0,Math.min(50,Number($('pwarn'+i)?.value||0)))}}).filter(p=>p.name)};
// Validate limits before allowing a new or updated asset to be saved.
const trafficSaveAsset=saveAsset;
saveAsset=function(){let parameters=readParams(),bad=parameters.find(p=>p.min!==null&&p.max!==null&&p.min>p.max);if(bad)return alert(`Check ${bad.name}: the minimum cannot be greater than the maximum.`);trafficSaveAsset()};
function updateTrafficRow(i){const v=visit();const r=v?.readings?.[i];const input=$('reading'+i),badge=$('traffic-reading-'+i);if(!r||!input||!badge)return;let a=trafficAssessment(r,input.value);badge.innerHTML=trafficPill(a);badge.title=a.reason;input.setAttribute('aria-describedby','traffic-reading-'+i)}
// Real-time visual feedback while taking a test; saving remains an explicit user action.
test=function(){const v=visit();if(!v)return go('visits');premiumHead('Record test results',`${v.siteName} · ${v.assetName}`);$('main').innerHTML=`${card('Visit details',field('testdate','Visit date',v.date,'date')+`<p class="muted">${esc(v.type)} · ${v.readings.length} configurable asset parameters</p><div class="traffic-colour-guide"><strong>Traffic-light analysis</strong><div class="traffic-key">${trafficPill({key:'green',label:'Within limits'})}${trafficPill({key:'amber',label:'Near boundary'})}${trafficPill({key:'red',label:'Out of range'})}${trafficPill({key:'grey',label:'Unassessed'})}</div><p class="traffic-note">Limits and warning sensitivities are configured separately for each asset. Amber remains within limits; red means outside limits.</p></div>`)}${card('Water test results',v.readings.map((r,i)=>`<div class="traffic-field"><label for="reading${i}">${esc(r.name)}<div class="traffic-note">${trafficRange(r)}</div></label><input id="reading${i}" type="number" inputmode="decimal" step="any" value="${esc(r.value??'')}" placeholder="—" oninput="updateTrafficRow(${i})"><span class="traffic-unit">${esc(r.unit)}</span><div id="traffic-reading-${i}">${trafficPill(trafficAssessment(r))}</div></div>`).join('')||'<p class="muted">No parameters are configured for this asset.</p>')}${card('Engineer observations',`<div class="field"><label for="notes">Visit notes</label><textarea id="notes">${esc(v.notes)}</textarea></div><div class="field"><label for="actions">Required corrective actions</label><textarea id="actions">${esc(v.actions)}</textarea></div>`)}${card('Site photographs',`<p class="note">Photographs are associated with this asset's visit.</p><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event)"><div class="photos" id="photoList">${v.photos.map((p,i)=>`<img class="photo" src="${p}" alt="Site photograph ${i+1}">`).join('')}</div>`)}${signatureCard(v)}<div class="grid2">${btn('Save visit','saveTest()')}${btn('Preview report','saveTest(true)','ghost')}</div>`;requestAnimationFrame(initSignature)};
// PDF result tables use explicit text and accessible colour — including printing from Safari.
rTable=function(v){return `<table class="traffic-results"><thead><tr><th>Test parameter</th><th>Reading</th><th>Asset operating limits</th><th>Assessment</th></tr></thead><tbody>${(v.readings||[]).map(r=>{let a=trafficAssessment(r);return `<tr class="row-${a.key}"><td>${esc(r.name)}</td><td>${r.value===null||r.value===undefined||String(r.value)===''?'—':esc(r.value)} ${esc(r.unit)}</td><td>${trafficRange(r)}</td><td class="traffic-cell">${trafficPill(a)}</td></tr>`}).join('')}</tbody></table>`};
// Preserve action-register enhancements from the preceding edition, overriding only report summary content.
const trafficBaseReportSection=reportSection;
reportSection=function(id,vs,s){if(id==='summary'){let c=trafficCounts(vs);return `<h3>Executive summary</h3><p>${vs.length} asset visit${vs.length===1?'':'s'} assessed across ${new Set(vs.map(v=>v.type)).size} system type(s). <strong>${c.red}</strong> outside-limit result(s), <strong>${c.amber}</strong> warning result(s), <strong>${c.green}</strong> within-limit result(s) and <strong>${c.grey}</strong> unassessed result(s).</p><p class="note">Traffic-light assessments use the configured asset limits recorded with each visit. Amber means within limits but approaching a boundary; it is not a regulatory compliance determination.</p>`}if(id==='assets'){return `<h3>Asset overview</h3><table><thead><tr><th>Asset</th><th>Type</th><th>Visit date</th><th>Result</th></tr></thead><tbody>${vs.map(v=>{let c=trafficCounts([v]),key=c.red?'red':c.amber?'amber':c.grey?'grey':'green',label=c.red?`${c.red} outside`:c.amber?`${c.amber} warning`:c.grey?'Incomplete':'Within limits';return `<tr class="row-${key}"><td>${esc(v.assetName)}</td><td>${esc(v.type)}</td><td>${esc(v.date)}</td><td>${trafficPill({key,label})}</td></tr>`}).join('')}</tbody></table>`}return trafficBaseReportSection(id,vs,s)};
// Add a visual summary to all individual and consolidated documents, regardless of selected sections.
const trafficBaseBuiltReport=builtReport;
builtReport=function(vs,s,title){const html=trafficBaseBuiltReport(vs,s,title);return html.replace(/(<h2[^>]*>[\s\S]*?<\/h2>)/,`$1${trafficSummaryHTML(vs)}`)};
// Include the full four-way assessment in downloadable reading exports.
exportCsv=function(){const rows=[['Site','Asset','Type','Date','Parameter','Value','Unit','Minimum','Maximum','Amber band %','Traffic light status']];db.visits.forEach(v=>(v.readings||[]).forEach(r=>rows.push([v.siteName,v.assetName,v.type,v.date,r.name,r.value,r.unit,r.min??'',r.max??'',r.warningPct??10,trafficAssessment(r).label])));let csv=rows.map(row=>row.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='aquaops-readings-'+todayLocal()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};

render();

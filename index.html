<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#081d35"><title>AquaOps Pro | Field Engineering</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#14243a;background:#edf3f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}.shell{max-width:760px;margin:auto;min-height:100dvh;background:#f3f7fa;padding-bottom:92px}.top{background:linear-gradient(130deg,#071b34,#0b4260);color:white;padding:calc(16px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 25px 25px}.brand{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}.brand em{color:#4fe1d0;font-style:normal}.top h1{font-size:26px;margin:24px 0 4px}.top small{color:#b7d5e4}.content{padding:18px;display:grid;gap:16px}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 3px 18px #1435520d;border:1px solid #e1eaf0}.card h2{font-size:17px;margin:0 0 12px}.muted{color:#65768a;font-size:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#fff;border:1px solid #dbe7ee;border-radius:14px;padding:14px}.metric strong{display:block;font-size:27px;margin:7px 0 1px}.metric span{color:#506780;font-size:12px}.btn{border:0;background:linear-gradient(100deg,#007c9a,#09a69b);color:white;border-radius:12px;padding:13px 16px;font-weight:700;min-height:46px}.btn.ghost{background:#eff6fa;color:#096781;border:1px solid #cfe1ea}.btn.danger{background:#ffefed;color:#b52b24}.btn.small{font-size:13px;padding:8px 12px;min-height:auto}.stack{display:grid;gap:10px}.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}.rowline{border-top:1px solid #e7edf2;padding:13px 0}.rowline:first-child{border-top:0}.chip{font-size:11px;padding:5px 9px;border-radius:22px;background:#dff5f4;color:#08786f;display:inline-block;font-weight:700}.chip.alert{background:#fff0d9;color:#9d5a08}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;background:white;border-top:1px solid #dce6ee;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:20}.tabs button{border:0;background:none;display:grid;gap:3px;justify-items:center;color:#63758a;font-size:10px;min-width:55px}.tabs .active{color:#008e9b;font-weight:800}.tabs .ico{font-size:21px}.field{display:grid;gap:5px;margin:0 0 12px}.field label{font-size:12px;color:#455d74;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d2e0e8;border-radius:10px;background:white;color:#20364c;min-width:0}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #80d9d1}.note{font-size:12px;color:#586e81;line-height:1.5}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.testrow{display:grid;grid-template-columns:1fr 110px 66px;align-items:center;gap:8px;border-bottom:1px solid #edf2f6;padding:8px 0}.testrow label{font-size:13px;font-weight:600}.testrow input{width:100%;padding:9px;border:1px solid #ccdce5;border-radius:9px}.testrow span{font-size:11px;color:#657b8c}.status{font-size:11px;font-weight:800}.status.ok{color:#088662}.status.bad{color:#c0462c}.photo{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid #d4e3ea}.photos{display:flex;flex-wrap:wrap;gap:9px}.hidden{display:none!important}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead h2{margin:0}.back{border:0;background:transparent;color:#b8f6ed;padding:0;font-size:15px}.notice{padding:12px;background:#fff6e7;border-radius:12px;color:#815318;font-size:12px}.report{font-family:Arial,sans-serif;color:#14263c;background:white;padding:22px;font-size:12px}.report h2{background:#0b668b;color:white;padding:10px;border-radius:5px;font-size:19px}.report table{width:100%;border-collapse:collapse;font-size:11px}.report th,.report td{border:1px solid #cbdbe5;padding:7px;text-align:left}.report th{background:#e7f1f7}.report .rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.report .rhead strong{font-size:18px;color:#077892}.report .rphotos{display:flex;gap:8px;flex-wrap:wrap}.report .rphotos img{width:115px;height:90px;object-fit:cover}.report p{line-height:1.5}.report .sig{margin-top:30px;border-top:1px solid #aaa;padding-top:9px}.empty{text-align:center;padding:20px;color:#63788b}.footerhint{text-align:center;font-size:11px;color:#8292a2;padding:0 14px 22px}@media print{.top,.tabs,.noprint,.footerhint{display:none!important}.shell,.content{max-width:none;background:white;padding:0;display:block}.card{box-shadow:none;border:0;padding:0}.report{padding:12mm}body{background:white}@page{size:A4;margin:11mm}}
</style></head><body><div class="shell"><header class="top" id="header"></header><main class="content" id="main"></main><div class="footerhint noprint">AquaOps Pro • Browser prototype • Data stored on this device</div></div><nav class="tabs noprint" id="tabs"></nav><script>
'use strict';
const TYPES=['Cooling Tower','Boiler','Closed System','Pasteuriser','Domestic Temperature'];
const PRESETS={
'Cooling Tower':[['pH','',7.5,9],['Conductivity','µS/cm',0,2000],['Hardness as CaCO₃','ppm',0,300],['Alkalinity as CaCO₃','ppm',100,400],['Inhibitor','ppm',200,400],['Biocide','ppm',10,50],['Water Temperature','°C',0,40]],
'Boiler':[['pH','',10.5,11.5],['Conductivity','µS/cm',0,5000],['TDS','ppm',0,3500],['Hardness as CaCO₃','ppm',0,10],['Phosphate as PO₄','ppm',20,60],['Sulphite as SO₃','ppm',30,50],['Alkalinity as CaCO₃','ppm',300,600],['Feedwater Temperature','°C',60,95]],
'Closed System':[['pH','',7.5,10],['Conductivity','µS/cm',0,3000],['Hardness as CaCO₃','ppm',0,300],['Nitrite','ppm',500,1200],['Molybdate','ppm',50,300],['Iron','ppm',0,2],['Water Temperature','°C',0,80]],
'Pasteuriser':[['pH','',6.5,9],['Conductivity','µS/cm',0,2500],['Hardness as CaCO₃','ppm',0,300],['Inhibitor','ppm',100,400],['Biocide','ppm',5,50],['Temperature','°C',0,90]],
'Domestic Temperature':[['Cold Water Temperature','°C',0,20],['Hot Water Temperature','°C',50,100],['Hot Water Flow','°C',50,100],['Hot Water Return','°C',50,100]]};
const SITES=[['Thomas Hardy – Warrington','Cooling Tower'],['Suez EfW – Bolton','Boiler'],['Bridge Aluminium – Kettering','Closed System'],['Magnera – Caerphilly','Pasteuriser'],['Thames Water – Maple Lodge','Domestic Temperature']];
const KEY='aquaops_safari_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.sites))db={sites:SITES.map((s,i)=>({id:'s'+i,name:s[0],type:s[1],notes:'',params:paramsFor(s[1])})),visits:[]};
function paramsFor(t){return(PRESETS[t]||[]).map(x=>({name:x[0],unit:x[1],min:x[2],max:x[3]}))}function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage is full. Try removing large photos; Safari device storage is limited.')}}
const state={page:'dashboard',site:null,visit:null};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const date=()=>new Date().toISOString().slice(0,10);const site=()=>db.sites.find(s=>s.id===state.site);const visit=()=>db.visits.find(v=>v.id===state.visit);const sid=()=>('id'+Date.now()+Math.random().toString(36).slice(2,7));const fmt=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch{return d}};
function go(p,siteid,vid){state.page=p;if(siteid!==undefined)state.site=siteid;if(vid!==undefined)state.visit=vid;render();window.scrollTo(0,0)}
function head(title,sub){$('header').innerHTML=`<div class="brand"><div>💧 AquaOps <em>Pro</em></div><div style="font-size:12px;color:#a3dfe4">FIELD EDITION</div></div><h1>${esc(title)}</h1><small>${esc(sub||'Water treatment • Field reporting')}</small>`}
const nav=[['dashboard','⌂','Home'],['sites','▦','Sites'],['visits','◷','Visits'],['calculator','⚗','Dose'],['settings','⚙','More']];function drawNav(){ $('tabs').innerHTML=nav.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}
function card(title,inner){return `<section class="card"><h2>${title}</h2>${inner}</section>`}function field(id,label,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function btn(label,handler,cls=''){return `<button class="btn ${cls}" onclick="${handler}">${label}</button>`}
function render(){drawNav();const fn=({dashboard,sites,siteDetail,siteEdit,visits,test,visitDetail,calculator,settings,report})[state.page]||dashboard;fn()}
function dashboard(){head('Dashboard','Your field engineering workspace');let due=db.visits.filter(v=>v.actions?.trim()).length;let recent=db.visits.slice(-3).reverse();$('main').innerHTML=`<div class="grid2"><div class="metric"><span>Customer sites</span><strong>${db.sites.length}</strong><span>Ready to visit</span></div><div class="metric"><span>Reports recorded</span><strong>${db.visits.length}</strong><span>On this device</span></div><div class="metric"><span>Reports with actions</span><strong>${due}</strong><span>Follow up as needed</span></div><div class="metric"><span>Report templates</span><strong>${TYPES.length}</strong><span>Editable per site</span></div></div>${card('Quick actions',`<div class="grid2">${btn('＋ New site',"go('siteEdit',null)")}${btn('🧪 Record visit',"go('sites')",'ghost')}${btn('⚗ Dosing calculator',"go('calculator')",'ghost')}${btn('📄 View reports',"go('visits')",'ghost')}</div>`)}${card('Recent visits',recent.length?recent.map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${fmt(v.date)} · ${esc(v.type)}</div></div>${btn('View',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join(''):'<div class="empty">No visits recorded yet. Start with a customer site.</div>')}<div class="notice">Prototype only. Example test limits are illustrative, not approved operating or ACOP L8/HSG274 compliance criteria. Configure and verify limits for each actual system before professional use.</div>`}
function sites(){head('Customer sites','Saved locally on your iPhone');$('main').innerHTML=`${btn('＋ Add customer site',"go('siteEdit',null)")}${card('All sites',db.sites.map(s=>`<div class="rowline inline"><div><strong>${esc(s.name)}</strong><div style="margin-top:5px"><span class="chip">${esc(s.type)}</span></div></div>${btn('Open',`go('siteDetail','${s.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">Add your first site.</div>')}`}
function siteDetail(){const s=site();if(!s)return go('sites');head(s.name,s.type);const vs=db.visits.filter(v=>v.siteId===s.id).reverse();$('main').innerHTML=`${card('Site information',`<span class="chip">${esc(s.type)}</span><p class="note">${esc(s.notes||'No site notes added.')}</p><div class="grid2">${btn('🧪 Start visit',`startVisit('${s.id}')`)}${btn('⚙ Edit site',"go('siteEdit')",'ghost')}</div>`)}${card('Recent reports',vs.map(v=>`<div class="rowline inline"><div><strong>${fmt(v.date)}</strong><div class="muted">${v.readings.length} parameters · ${v.photos.length} photos</div></div>${btn('Report',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits saved for this site.</div>')}`}
function siteEdit(){const s=site();head(s?'Edit customer site':'New customer site','Customise parameters, units and limits');$('main').innerHTML=`${card('Site details',field('sitename','Customer / site name',s?.name||'')+`<div class="field"><label>System type</label><select id="sitetype" onchange="typeChanged()">${TYPES.map(t=>`<option ${s?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Site notes</label><textarea id="sitenotes">${esc(s?.notes||'')}</textarea></div>`)}${card('Custom test parameters',`<div id="parameter-fields"></div>${btn('＋ Add parameter','addParameter()','small ghost')}<p class="note">Each site has its own parameter list and editable minimum/maximum values. Blank limit = not assessed.</p>`)}<div class="grid2">${btn('Save site','saveSite()')}${btn('Cancel',"go('sites')",'ghost')}</div>`;drawParams(s?.params||paramsFor(TYPES[0]))}
function drawParams(params){$('parameter-fields').innerHTML=params.map((p,i)=>`<div class="rowline param" data-i="${i}"><div class="grid2">${field('pn'+i,'Parameter name',p.name)}${field('pu'+i,'Unit',p.unit)}</div><div class="grid2">${field('pmin'+i,'Minimum',p.min??'','number','step="any"')}${field('pmax'+i,'Maximum',p.max??'','number','step="any"')}</div>${btn('Remove',`removeParam(${i})`,'small danger')}</div>`).join('')};function readParams(){return [...document.querySelectorAll('.param')].map(e=>{let i=e.dataset.i;return {name:$('pn'+i).value.trim(),unit:$('pu'+i).value.trim(),min:$('pmin'+i).value===''?null:Number($('pmin'+i).value),max:$('pmax'+i).value===''?null:Number($('pmax'+i).value)}}).filter(p=>p.name)}function addParameter(){drawParams([...readParams(),{name:'',unit:'',min:null,max:null}])}function removeParam(i){drawParams(readParams().filter((_,j)=>j!==i))}function typeChanged(){if(confirm('Replace the current parameters with example parameters for this system type?'))drawParams(paramsFor($('sitetype').value))}function saveSite(){let name=$('sitename').value.trim();if(!name)return alert('Enter a site name');let obj={id:site()?.id||sid(),name,type:$('sitetype').value,notes:$('sitenotes').value.trim(),params:readParams()};let i=db.sites.findIndex(x=>x.id===obj.id);if(i>=0)db.sites[i]=obj;else db.sites.push(obj);persist();go('siteDetail',obj.id)}
function startVisit(id){let s=db.sites.find(x=>x.id===id);if(!s)return;const v={id:sid(),siteId:s.id,siteName:s.name,type:s.type,date:date(),readings:s.params.map(p=>({...p,value:''})),notes:'',actions:'',photos:[]};db.visits.push(v);persist();go('test',id,v.id)}
function visits(){head('Visit history','Your saved test results and reports');$('main').innerHTML=`${btn('＋ Start new site visit',"go('sites')")}${card('Saved visits',db.visits.slice().reverse().map(v=>`<div class="rowline inline"><div><strong>${esc(v.siteName)}</strong><div class="muted">${fmt(v.date)} · ${esc(v.type)}</div></div>${btn('Open',`go('visitDetail',null,'${v.id}')`,'small ghost')}</div>`).join('')||'<div class="empty">No visits yet.</div>')}`}
function test(){const v=visit();if(!v)return go('visits');head('Record test results',v.siteName);$('main').innerHTML=`${card('Visit details',field('testdate','Visit date',v.date,'date')+`<div class="muted">${esc(v.type)} · ${v.readings.length} configurable parameters</div>`)}${card('Water test results',v.readings.map((r,i)=>`<div class="testrow"><label for="reading${i}">${esc(r.name)}</label><input id="reading${i}" type="number" step="any" value="${esc(r.value)}" placeholder="—"><span>${esc(r.unit)}</span></div>`).join('')||'<p>No parameters set for this site.</p>')}${card('Engineer observations',`<div class="field"><label for="notes">Visit notes</label><textarea id="notes" placeholder="System observations, recommendations...">${esc(v.notes)}</textarea></div><div class="field"><label for="actions">Required corrective actions</label><textarea id="actions" placeholder="Record follow-up actions...">${esc(v.actions)}</textarea></div>`)}${card('Site photographs',`<p class="note">Take a photo or select from your library. Photos are stored on this device and added to this visit's report.</p><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event)"><div class="photos" id="photoList">${v.photos.map((p,i)=>`<img class="photo" alt="Site photo ${i+1}" src="${p}">`).join('')}</div>`)}<div class="grid2">${btn('Save visit',"saveTest()")}${btn('Preview report',"saveTest(true)",'ghost')}</div>`}
function saveTest(preview=false){const v=visit();if(!v)return;v.date=$('testdate').value;v.readings.forEach((r,i)=>r.value=$('reading'+i).value);v.notes=$('notes').value;v.actions=$('actions').value;persist();if(preview)go('report');else go('visitDetail',null,v.id)}
async function addPhoto(event){const f=event.target.files[0];if(!f)return;const v=visit();if(!v)return;const img=new Image();const blob=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas');const scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);v.photos.push(c.toDataURL('image/jpeg',.62));URL.revokeObjectURL(blob);persist();$('photoList').innerHTML=v.photos.map((p,i)=>`<img class="photo" src="${p}" alt="Site photo ${i+1}">`).join('');event.target.value=''};img.onerror=()=>alert('Could not read this image');img.src=blob}
function visitDetail(){let v=visit();if(!v)return go('visits');head('Saved site visit',v.siteName);const count=v.readings.filter(x=>x.value!=='').length,issues=v.readings.filter(x=>outOfRange(x)).length;$('main').innerHTML=`${card('Visit summary',`<div class="inline"><div><strong>${fmt(v.date)}</strong><div class="muted">${esc(v.type)}</div></div><span class="chip ${issues?'alert':''}">${issues?issues+' flagged readings':'No flagged readings'}</span></div><p class="note">${count} of ${v.readings.length} results entered · ${v.photos.length} photo(s)</p>`)}<div class="grid2">${btn('Edit results',"go('test')",'ghost')}${btn('📄 View report',"go('report')")}</div>${card('Recorded readings',v.readings.map(r=>`<div class="rowline inline"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.unit)}</div></div><div style="text-align:right"><strong>${esc(r.value||'—')}</strong><div class="status ${r.value===''?'':outOfRange(r)?'bad':'ok'}">${r.value===''?'Not recorded':outOfRange(r)?'Out of range':'Recorded'}</div></div></div>`).join(''))}`}
function outOfRange(r){if(r.value===''||!Number.isFinite(Number(r.value)))return false;const n=Number(r.value);return (r.min!=null&&n<r.min)||(r.max!=null&&n>r.max)}
function report(){let v=visit();if(!v)return go('visits');head('Report preview','Print or save as PDF from Safari');const entered=v.readings.filter(r=>r.value!=='');const flagged=entered.filter(outOfRange);const photos=v.photos.map((p,i)=>`<img src="${p}" alt="Site photograph ${i+1}">`).join('');$('main').innerHTML=`<div class="noprint grid2">${btn('← Edit results',"go('test')",'ghost')}${btn('Print / Save PDF','window.print()')}</div><section class="card report" id="printreport"><div class="rhead"><strong>💧 AquaOps <span style="color:#05a59c">Pro</span></strong><span>FIELD SERVICE REPORT</span></div><h2>${esc(v.type)} Service Report</h2><table><tr><th>Site</th><td>${esc(v.siteName)}</td></tr><tr><th>Visit date</th><td>${fmt(v.date)}</td></tr><tr><th>System type</th><td>${esc(v.type)}</td></tr><tr><th>Results requiring review</th><td>${flagged.length} of ${entered.length} recorded readings</td></tr></table><h3>Water analysis results</h3><table><tr><th>Parameter</th><th>Result</th><th>Configured limits</th><th>Status</th></tr>${v.readings.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.value||'—')} ${esc(r.unit)}</td><td>${r.min==null?'—':esc(r.min)} to ${r.max==null?'—':esc(r.max)}</td><td>${r.value===''?'Not tested':outOfRange(r)?'Review':'Within limits*'}</td></tr>`).join('')}</table><h3>Observations</h3><p>${esc(v.notes||'None recorded.')}</p><h3>Corrective actions</h3><p>${esc(v.actions||'None recorded.')}</p>${photos?`<h3>Site photographs</h3><div class="rphotos">${photos}</div>`:''}<div class="sig">Engineer signature: _________________________________ &nbsp; Date: _______________</div><p class="note">* Limits are user-configured, and require site-specific professional validation. This prototype does not certify ACOP L8 / HSG274 compliance.</p></section><div class="noprint">${btn('Print or Save PDF','window.print()')}</div>`}
function calculator(){head('Dosing calculator','Demonstration — engineering verification required');$('main').innerHTML=`${card('Concentration adjustment',`${field('volume','System volume (L)',10000,'number','step="any" min="0"')}${field('current','Current concentration (mg/L)',20,'number','step="any"')}${field('target','Target concentration (mg/L)',50,'number','step="any"')}${field('strength','Active ingredient by mass (%)',25,'number','step="any" min="0" max="100"')}${field('density','Product density (kg/L)',1.1,'number','step="any" min="0"')}<p class="note">Assumes complete mixing, concentration expressed as mg/L active ingredient, and no demand, loss or reaction. Does not apply to every chemical or treatment programme.</p>${btn('Calculate dose','calculate()')}<div id="calcresult" style="margin-top:15px"></div>`)}`}
function calculate(){let [vol,cur,tgt,str,den]=['volume','current','target','strength','density'].map(id=>Number($(id).value));if(![vol,cur,tgt,str,den].every(Number.isFinite)||vol<=0||str<=0||str>100||den<=0||tgt<cur){$('calcresult').innerHTML='<div class="notice">Enter valid positive volume, density and strength; target must be at least current concentration.</div>';return}let massmg=(tgt-cur)*vol;let litres=massmg/1e6/(str/100)/den;$('calcresult').innerHTML=`<div class="metric"><span>Theoretical neat product volume</span><strong>${litres.toFixed(3)} L</strong><span>${(litres*1000).toFixed(0)} mL of formulated product</span></div><p class="note">For preliminary planning only. Verify chemical basis, density, product specification, compatibility, dosing method and site risk assessment.</p>`}
function settings(){head('Settings & information','Manage demonstration data');$('main').innerHTML=`${card('About AquaOps Pro',`<p>Safari prototype v0.1</p><p class="note">This is an offline-friendly single-page demo. No account, server synchronisation, subscription payment, regulatory certification or automated emails have been implemented.</p>`)}${card('Data controls',`${btn('Export backup (JSON)','backup()','ghost')}<p class="note">Backup includes customer details, visits and photographs. Keep it secure.</p><div class="field"><label>Restore JSON backup</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div>${btn('Reset all demo data','resetAll()','danger')}`)}`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aquaops-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function restore(ev){let f=ev.target.files[0];if(!f)return;f.text().then(x=>{let data=JSON.parse(x);if(!Array.isArray(data.sites)||!Array.isArray(data.visits))throw Error('Invalid backup');if(confirm('Replace local data with this backup?')){db=data;persist();go('dashboard')}}).catch(()=>alert('Backup is invalid'))}function resetAll(){if(confirm('Delete all local sites, visits and photos and restore sample sites?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
